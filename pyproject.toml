[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-doc-keeper"
version = "0.1.0"
description = "Reusable 3-Cause Documentation Auditor & Decision Rule Router for Ocean, BACH, and arbitrary Git repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "ellmos-ai" }]
keywords = [
    "ast",
    "bach",
    "cli",
    "documentation",
    "documentation-audit",
    "drift-detection",
    "local-first",
    "open-ocean",
    "quality-assurance",
    "static-analysis",
    "zero-dependencies",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/doc-keeper"
Repository = "https://github.com/ellmos-ai/doc-keeper"
Documentation = "https://github.com/ellmos-ai/doc-keeper#readme"
Issues = "https://github.com/ellmos-ai/doc-keeper/issues"
Changelog = "https://github.com/ellmos-ai/doc-keeper/blob/main/CHANGELOG.md"

[project.scripts]
doc-keeper = "doc_keeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_keeper = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
